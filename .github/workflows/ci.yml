name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - run: bun test
      - run: bun run compile
      - run: test -z "$(git status --porcelain -- dist)"
      - run: bun run smoke
      - run: npm pack --dry-run
